<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Технический перерыв</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            padding: 20px;
            margin: 0;
        }

        .card {
            max-width: 500px;
            width: 100%;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border-radius: 48px;
            padding: 48px 40px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.05);
            text-align: center;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .icon-wrapper svg {
            width: 52px;
            height: 52px;
            fill: none;
            stroke: #a78bfa;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .title {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 12px;
            background: linear-gradient(to right, #e0d7ff, #a78bfa);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            font-size: 1rem;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 28px;
            font-weight: 400;
        }

        .subtitle strong {
            color: #c4b5fd;
            font-weight: 500;
        }

        .status-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .status-row span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #a78bfa;
            animation: pulse-dot 1.6s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.3; transform: scale(0.9); }
        }

        .btn {
            display: inline-block;
            padding: 14px 36px;
            border-radius: 60px;
            background: linear-gradient(to right, #7c3aed, #6d28d9);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.2s ease;
            box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
            text-decoration: none;
            letter-spacing: 0.01em;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.5);
        }

        .btn:active {
            transform: translateY(0px);
            box-shadow: 0 4px 16px rgba(124, 58, 237, 0.3);
        }

        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
                border-radius: 32px;
            }
            .title {
                font-size: 1.7rem;
            }
            .icon-wrapper {
                width: 72px;
                height: 72px;
            }
            .icon-wrapper svg {
                width: 40px;
                height: 40px;
            }
            .status-row {
                gap: 12px;
                font-size: 0.75rem;
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- Иконка -->
        <div class="icon-wrapper">
            <svg viewBox="0 0 24 24" stroke="currentColor">
                <path d="M12 15a3 3 0 100-6 3 3 0 000 6z" />
                <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z" />
            </svg>
        </div>

        <!-- Заголовок -->
        <h1 class="title">Технический перерыв</h1>

        <!-- Текст -->
        <p class="subtitle">
            Мы обновляем сервис, чтобы он стал ещё быстрее и удобнее.<br />
            Приносим извинения за временные неудобства.
        </p>

        <!-- Статус -->
        <div class="status-row">
            <span><span class="dot"></span> Работы ведутся в штатном режиме</span>
        </div>

        <!-- Кнопка обновления -->
        <button class="btn" onclick="location.reload()">Обновить страницу</button>
    </div>
</body>
</html>
